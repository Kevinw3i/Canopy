name: Release Control Plane Image

on:
  push:
    tags:
      - "cp-v*"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    concurrency:
      group: control-plane-image-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          image_tag="${GITHUB_REF_NAME}"

          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag: $image_tag"
            exit 1
          fi

          if [ "${image_tag,,}" = "latest" ]; then
            echo "::error::Using 'latest' is not allowed. Specify an explicit version tag or git SHA for deterministic deployments."
            exit 1
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Validate Terraform
        shell: bash
        run: scripts/test-terraform-module.sh

      - name: Validate deployment scripts
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/test-terraform-module.sh
          bash -n scripts/validate-entitlements.sh
          bash -n scripts/test-validate-entitlements.sh
          scripts/test-validate-entitlements.sh
          bash -n scripts/validate-terraform-tfvars.sh
          bash -n scripts/test-validate-terraform-tfvars.sh
          scripts/test-validate-terraform-tfvars.sh
          bash -n scripts/test-deploy-control-plane-local.sh
          scripts/test-deploy-control-plane-local.sh
          sh -n scripts/docker-entrypoint.sh
          bash -n scripts/test-docker-entrypoint.sh
          scripts/test-docker-entrypoint.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # CI already runs the full workspace test suite on master and pull requests.
      # Keep this release workflow focused on building and pushing the image.
      # - name: Run tests
      #   run: cargo test --workspace

      - name: Write entitlements file
        shell: bash
        env:
          ENTITLEMENTS_TOML_B64: ${{ secrets.CONTROL_PLANE_ENTITLEMENTS_TOML_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${ENTITLEMENTS_TOML_B64}" ]; then
            echo "::error::Missing GitHub secret CONTROL_PLANE_ENTITLEMENTS_TOML_B64"
            exit 1
          fi

          printf '%s' "${ENTITLEMENTS_TOML_B64}" | base64 -d > entitlements.toml
          test -s entitlements.toml

      - name: Compute entitlements hash
        id: entitlements
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(sha256sum entitlements.toml | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Validate Terraform variables and entitlements
        shell: bash
        env:
          TERRAFORM_TFVARS_B64: ${{ secrets.CONTROL_PLANE_TFVARS_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${TERRAFORM_TFVARS_B64}" ]; then
            echo "::error::Missing GitHub secret CONTROL_PLANE_TFVARS_B64"
            exit 1
          fi

          printf '%s' "${TERRAFORM_TFVARS_B64}" | base64 -d > infra/terraform.tfvars
          ./scripts/validate-terraform-tfvars.sh infra \
            -var="create_service=true" \
            -var="image_tag=${{ steps.meta.outputs.image_tag }}"
          ./scripts/validate-entitlements.sh entitlements.toml infra/terraform.tfvars

      - name: Resolve Terraform deployment settings
        id: platform
        shell: bash
        run: |
          set -euo pipefail

          cpu_architecture=""
          project=""
          if [ ! -s infra/terraform.tfvars ]; then
            echo "::error::infra/terraform.tfvars was not written from CONTROL_PLANE_TFVARS_B64"
            exit 1
          fi

          cpu_architecture="$(
            awk -F= '
              /^[[:space:]]*#/ { next }
              /^[[:space:]]*cpu_architecture[[:space:]]*=/ {
                value = $2
                sub(/#.*/, "", value)
                gsub(/[[:space:]"]/, "", value)
                print value
                exit
              }
            ' infra/terraform.tfvars
          )"
          project="$(
            awk -F= '
              /^[[:space:]]*#/ { next }
              /^[[:space:]]*project[[:space:]]*=/ {
                value = $2
                sub(/#.*/, "", value)
                gsub(/[[:space:]"]/, "", value)
                print value
                exit
              }
            ' infra/terraform.tfvars
          )"
          cpu_architecture="${cpu_architecture:-X86_64}"
          project="${project:-canopy}"

          case "$cpu_architecture" in
            X86_64) platform="linux/amd64" ;;
            ARM64) platform="linux/arm64" ;;
            *)
              echo "::error::Unsupported cpu_architecture: $cpu_architecture"
              exit 1
              ;;
          esac

          echo "cpu_architecture=$cpu_architecture" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=$project/control-plane" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check image tag does not already exist
        shell: bash
        run: |
          set -euo pipefail

          set +e
          output=$(aws ecr describe-images \
            --repository-name "${{ steps.platform.outputs.ecr_repository }}" \
            --image-ids "imageTag=${{ steps.meta.outputs.image_tag }}" \
            --region "${AWS_REGION}" 2>&1)
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::ECR image tag already exists and the repository is immutable: ${{ steps.meta.outputs.image_tag }}"
            exit 1
          fi

          if ! grep -q "ImageNotFoundException" <<< "$output"; then
            echo "$output"
            exit "$status"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/control-plane/Dockerfile
          platforms: ${{ steps.platform.outputs.platform }}
          push: true
          build-args: |
            ENTITLEMENTS_SHA=${{ steps.entitlements.outputs.sha }}
          secret-files: |
            entitlements_toml=entitlements.toml
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ steps.platform.outputs.ecr_repository }}:${{ steps.meta.outputs.image_tag }}

      - name: Write deployment summary
        shell: bash
        run: |
          set -euo pipefail

          image_uri="${{ steps.ecr.outputs.registry }}/${{ steps.platform.outputs.ecr_repository }}:${{ steps.meta.outputs.image_tag }}"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Control-plane image pushed

          Image:

          \`\`\`text
          ${image_uri}
          \`\`\`

          Platform: \`${{ steps.platform.outputs.platform }}\` (${{ steps.platform.outputs.cpu_architecture }})

          Terraform project: \`${{ steps.platform.outputs.project }}\`

          Next manual Terraform step:

          \`\`\`bash
          AWS_PROFILE=your-aws-profile terraform -chdir=infra plan \\
            -var="create_service=true" \\
            -var="image_tag=${{ steps.meta.outputs.image_tag }}" \\
            -out=tfplan.phase2
          AWS_PROFILE=your-aws-profile terraform -chdir=infra apply tfplan.phase2
          \`\`\`
          EOF
