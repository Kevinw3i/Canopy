# ============================================================
# 權限規則範本（生產環境用）
#
# 使用方式：
#   cp entitlements.sample.toml entitlements.toml
#   編輯後填入你的 AWS 帳號、區域、Role ARN
#
# 結構：
#   [[rules]]       — 每個群組一組權限規則
#   [[memberships]] — 使用者 ID 到群組的對應
#
# ── role_arn 三種模式 ────────────────────────────────
#
#   "direct"              直接用本機/Task Role 的 AWS 憑證（不走 AssumeRole）
#   "profile:NAME"        用 ~/.aws/credentials 裡指定的 profile（本機開發用）
#   "arn:aws:iam::...:role/..."  AssumeRole 到該 IAM Role（生產環境用）
# ============================================================

# ── 群組 1：平台工程（完整權限）───────────────────────

[[rules]]
id = "rule-platform-eng"
group = "platform-engineering"
allowed_regions = ["ap-northeast-1"]           # ← 改成你的區域
allowed_log_group_arns = [
    "arn:aws:logs:*:<ACCOUNT_ID>:log-group:*", # ← 改成你的帳號 ID，或限縮到特定 log group
]
allowed_os_users = ["ec2-user", "ubuntu"]

[rules.features]
can_view_ec2 = true
can_use_cloudwatch_search = true
can_use_cloudwatch_tail = true
can_use_ssm = true
can_use_ec2_instance_connect = true
# ── Power actions（start / stop / reboot）─────────────
# 預設 false。若要授權，建議用下方獨立 rule + 獨立
# `CanopyOperatorRole`，**不要**直接在這個 read/connect
# rule 加。詳見群組 1B。
# can_start_ec2 = false
# can_stop_ec2 = false
# can_reboot_ec2 = false
# ── ECS task inventory / exec（預設 false）────────────
# 建議用下方獨立 ECS rule 授權，避免和 EC2 / CloudWatch
# rule 的範圍混在一起。
# can_view_ecs = false
# can_use_ecs_exec = false

[[rules.allowed_accounts]]
account_id = "<ACCOUNT_ID>"                    # ← 改成你的 AWS 帳號 ID
account_name = "production"                    # ← 自訂名稱，顯示在 TUI 裡
role_arn = "arn:aws:iam::<ACCOUNT_ID>:role/CanopyRole"  # ← 改成你的 Role ARN

# 多帳號範例（取消註解即可同時看多個帳號的資源）：
# [[rules.allowed_accounts]]
# account_id = "<ACCOUNT_ID_2>"
# account_name = "staging"
# role_arn = "arn:aws:iam::<ACCOUNT_ID_2>:role/CanopyRole"

# 只顯示特定 tag 的機器（取消註解啟用）：
# [[rules.instance_tag_selectors]]
# [rules.instance_tag_selectors.tags]
# Environment = ["production", "staging"]

# 排除特定機器（取消註解啟用）：
# [[rules.excluded_tag_selectors]]
# [rules.excluded_tag_selectors.tags]
# Sensitivity = ["high"]


# ── 群組 1B：平台工程 power-action（高風險，獨立 role）────────
#
# Start / Stop / Reboot 屬於高風險操作，建議遵循 least-privilege：
#   1. 用獨立 IAM role `CanopyOperatorRole`（與 read-only
#      `CanopyRole` 分離）
#   2. 用 instance_tag_selectors 限縮可操作的機器範圍
#   3. 同 group 的 user 同時 match read rule + power rule，
#      control-plane 會按操作類型自動挑選對應 role
#
# 觸發每次 power action 都會寫一筆 `ec2_power` audit log，含
# previous_state / requested_state / power_action / confirmation_present
# （詳見 docs/AUDIT-SCHEMA.md）。
#
# ⚠ 此 rule 寫好之後，要等 Phase 2 control-plane `/api/ec2/power`
#   endpoint 上線才會真正生效（在那之前只是準備權限資料）。

# [[rules]]
# id = "rule-platform-eng-power"
# group = "platform-engineering"
# allowed_regions = ["ap-northeast-1"]
#
# [rules.features]
# can_start_ec2 = true
# can_stop_ec2 = true
# can_reboot_ec2 = true
#
# [[rules.allowed_accounts]]
# account_id = "<ACCOUNT_ID>"
# account_name = "production"
# role_arn = "arn:aws:iam::<ACCOUNT_ID>:role/CanopyOperatorRole"  # ← 新 role
#
# # 強烈建議：用 tag 限縮可被 power 的機器（例：只允許 staging）
# [[rules.instance_tag_selectors]]
# [rules.instance_tag_selectors.tags]
# Environment = ["staging"]


# ── 群組 1C：平台工程 ECS task / exec（獨立 scope）────────
#
# `can_view_ecs` 只允許在 TUI 的 ECS view 看到授權 cluster/task。
# `can_use_ecs_exec` 允許進入 task container，必須同時有
# `can_view_ecs = true`，而且必須設定 allowed_clusters。
#
# ECS Exec 會固定執行 `/bin/sh`，不接受使用者自訂 command；
# control-plane 會先檢查 task/container scope、sidecar denylist、
# IAM simulation 與 audit fail-closed。
#
# [[rules]]
# id = "rule-platform-eng-ecs"
# group = "platform-engineering"
# allowed_regions = ["ap-northeast-1"]
# allowed_clusters = [
#     "arn:aws:ecs:ap-northeast-1:<ACCOUNT_ID>:cluster/prod-app",
# ]
# excluded_container_names = ["envoy", "xray-daemon", "log-router"]
#
# [rules.features]
# can_view_ecs = true
# can_use_ecs_exec = true
#
# [[rules.allowed_accounts]]
# account_id = "<ACCOUNT_ID>"
# account_name = "production"
# role_arn = "arn:aws:iam::<ACCOUNT_ID>:role/CanopyEcsExecRole"
#
# # 強烈建議：用 task tag 限縮可看到 / 可 exec 的 task。
# [[rules.task_tag_selectors]]
# [rules.task_tag_selectors.tags]
# Environment = ["production"]
#
# # 可選：排除敏感 task。
# [[rules.excluded_task_tag_selectors]]
# [rules.excluded_task_tag_selectors.tags]
# Sensitivity = ["high"]


# ── 群組 2：唯讀維運 ────────────────────────────────

