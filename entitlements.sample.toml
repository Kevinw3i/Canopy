# ]
# allowed_os_users = []
#
# [rules.features]
# can_view_ec2 = true
# can_use_cloudwatch_search = true
# can_use_cloudwatch_tail = false
# can_use_ssm = false
# can_use_ec2_instance_connect = false
# can_use_mcp = false
# can_use_mcp_cloudwatch = false
# can_view_mcp_raw_audit_plaintext = false
# can_use_mcp_ec2 = false
# can_use_mcp_database = false
#
# [[rules.allowed_accounts]]
# account_id = "<ACCOUNT_ID>"
# account_name = "production"
# role_arn = "arn:aws:iam::<ACCOUNT_ID>:role/CanopyReadOnly"


# ── Cognito / IdP 群組 → Canopy 群組對應 ─────────────
#
# production 建議用 Cognito User Pool group 管理成員，再在這裡
# 對應到 Canopy 授權群組。external_group 大小寫敏感。

# [[group_mappings]]
# external_group = "CanopyPlatformEngineering"
# canopy_group = "platform-engineering"

# [[group_mappings]]
# external_group = "CanopyReadonlyOps"
# canopy_group = "readonly-ops"


# ── 本地使用者 → Canopy 群組對應 ─────────────────────
#
# user_id 對應 OIDC 的 sub 或 email claim（production 模式）
# 或 dev-login 的 username（dev 模式）。production 逐步遷移到
# [[group_mappings]] 後，這裡可保留作 fallback / break-glass。

[[memberships]]
user_id = "admin@example.com"                  # ← 改成你的 OIDC email
group = "platform-engineering"

# [[memberships]]
# user_id = "viewer@example.com"
# group = "readonly-ops"
