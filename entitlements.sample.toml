# ============================================================
# 權限規則範本（生產環境用）
#
# 使用方式：
#   cp entitlements.sample.toml entitlements.toml
#   編輯後填入你的 AWS 帳號、區域、Role ARN
#
# 結構：
#   [[rules]]          — 每個 Canopy 群組一組權限規則
#   [[group_mappings]] — 外部 IdP/Cognito 群組到 Canopy 群組的對應
#   [[memberships]]    — 本地使用者 ID 到 Canopy 群組的對應（fallback / dev）
#
# ── role_arn 三種模式 ────────────────────────────────
#
#   "direct"              直接用本機/Task Role 的 AWS 憑證（不走 AssumeRole）
#   "profile:NAME"        用 ~/.aws/credentials 裡指定的 profile（本機開發用）
#   "arn:aws:iam::...:role/..."  AssumeRole 到該 IAM Role（生產環境用）
#   "arn:aws:iam::{account_id}:role/..." AWS Organizations discovery template
# ============================================================

# ── 群組 1：平台工程（完整權限）───────────────────────

[[rules]]
id = "rule-platform-eng"
group = "platform-engineering"
allowed_regions = ["ap-northeast-1"]           # ← 改成你的區域
allowed_log_group_arns = [
    "arn:aws:logs:*:<ACCOUNT_ID>:log-group:*", # ← 改成你的帳號 ID，或限縮到特定 log group
]
allowed_os_users = ["ec2-user", "ubuntu"]

[rules.features]
can_view_ec2 = true
can_use_cloudwatch_search = true
can_use_cloudwatch_tail = true
can_use_ssm = true
can_use_ec2_instance_connect = true
# ── MCP / AI tools ─────────────────────────────────
# can_use_mcp 是 MCP 總開關。開啟後使用者可在 TUI 的
# "MCP / AI Tools" 頁面啟動本機 MCP server，並連接 Codex CLI
# 或 Claude Code。
#
# Product Phase 3 提供 MCP 基礎工具與 CloudWatch data tools：
#   - canopy_describe_capabilities
#   - canopy_get_guidance
#   - canopy_list_allowed_log_groups（需 can_use_mcp_cloudwatch=true）
#   - canopy_preflight_request（需 can_use_mcp_cloudwatch=true）
#   - canopy_search_logs（需 can_use_mcp_cloudwatch=true 與 preflight token）
#   - canopy_run_insights_query（需 can_use_mcp_cloudwatch=true 與 preflight token / query token）
# 並可在 can_use_mcp_database=true 且 database_scopes 授權時
# 啟用 MCP Database v1。
#
# EC2 MCP data tools 是後續 phase；不要因為使用者
# 有 TUI CloudWatch 權限就自動開 MCP CloudWatch。
can_use_mcp = true
can_use_mcp_cloudwatch = false
# Raw MCP CloudWatch filter/query audit values are encrypted by default.
# Set this true only on a rule whose allowed_accounts / allowed_regions /
# allowed_log_group_arns also authorize the exact same CloudWatch scope.
can_view_mcp_raw_audit_plaintext = false
can_use_mcp_ec2 = false
# MCP Database v1 是獨立權限。開啟後仍需要下方
# [[rules.database_scopes]] 授權具體 connection / schema / table。
can_use_mcp_database = false
# ── Power actions（start / stop / reboot）─────────────
# 預設 false。若要授權，建議用下方獨立 rule + 獨立
# `CanopyOperatorRole`，**不要**直接在這個 read/connect
# rule 加。詳見群組 1B。
# can_start_ec2 = false
# can_stop_ec2 = false
# can_reboot_ec2 = false
# ── ECS task inventory / exec（預設 false）────────────
# 建議用下方獨立 ECS rule 授權，避免和 EC2 / CloudWatch
# rule 的範圍混在一起。
# can_view_ecs = false
# can_use_ecs_exec = false

# ── MCP Business Scopes（AI / MCP 業務語意提示）──────
#
# metadata 只提供 AI/MCP discovery usability hint，不授權任何 AWS
# 資源，也不能放大 allowed_accounts / allowed_regions /
# allowed_log_group_arns 的安全邊界。
#
# region 不放在 metadata；MCP 回傳的 regions 直接來自同一條
# rule 的 allowed_regions。platform / environment 採單值；多組
# 平台環境請用多個 [[rules.metadata.scopes]] 明確列出。
#
# 只有同一條 matching rule 同時具備：
#   can_use_mcp = true
#   can_use_mcp_cloudwatch = true
#   allowed_accounts / allowed_regions / allowed_log_group_arns
# 時，canopy_describe_capabilities 才會回傳 business_scopes。
[rules.metadata]
description = "MCP CloudWatch business scopes"

[[rules.metadata.scopes]]
platform = "PLATFORM_A"
environment = "production"
aliases = ["正式環境", "prod", "PRO"]

[[rules.metadata.scopes]]
platform = "PLATFORM_A"
environment = "demo"
aliases = ["Demo", "測試環境"]

[[rules.allowed_accounts]]
account_id = "<ACCOUNT_ID>"                    # ← 改成你的 AWS 帳號 ID
account_name = "production"                    # ← 自訂名稱，顯示在 TUI 裡
role_arn = "arn:aws:iam::<ACCOUNT_ID>:role/CanopyRole"  # ← 改成你的 Role ARN

# 多帳號範例（取消註解即可同時看多個帳號的資源）：
# [[rules.allowed_accounts]]
# account_id = "<ACCOUNT_ID_2>"
# account_name = "staging"
# role_arn = "arn:aws:iam::<ACCOUNT_ID_2>:role/CanopyRole"

# MCP Database v1 範例（取消註解前，必須先在 config.toml 或 Terraform
# database_connections_toml 設定同名 connection，並讓 ECS task role 可讀
# 該 Secrets Manager secret）。
#
# Also set `can_use_mcp_database = true` in this rule's [rules.features].
#
# [[rules.database_scopes]]
# name = "orders_prod_readonly"
# connection = "orders_prod"
# environment = "production"
# # IMPORTANT: allowed_schemas / allowed_tables must be lowercase ASCII.
# # The control-plane rejects mixed-case identifiers from MCP queries up
# # front to avoid silently conflating e.g. `orders` and `Orders` on MySQL
# # deployments with lower_case_table_names=0.
# # Leaving allowed_schemas = [] still enforces the connection's default
# # database — explicit cross-database qualifiers are denied.
# allowed_schemas = ["orders"]
# allowed_tables = ["orders", "order_items"]
# allowed_actions = ["select"]
# max_rows = 100
# statement_timeout_ms = 5000
# require_explain = true
# max_examined_rows = 10000
# allow_full_table_scan = false
#
# # OPT-IN: allow MCP queries to read VIEW objects in this scope.
# #
# # Default behavior (`allow_views = false`): the MDL-protected query
# # pipeline acquires `MDL_SHARED_READ` on every referenced object,
# # reads `information_schema.tables` on the same connection, and
# # REJECTS the query if any referenced object is not `BASE TABLE`.
# # The reason: a view can
# #   1. expand into base tables OUTSIDE this scope's allowed_schemas,
# #   2. run under a privileged DEFINER (bypassing the readonly user),
# #   3. hide a query plan that bypasses EXPLAIN row-cap / full-scan
# #      guards (because EXPLAIN reports the view's outer access type,
# #      not the rewritten base-table plan).
# #
# # Behavior with `allow_views = true`: every scope still goes through
# # the SAME MDL-protected pipeline — EXPLAIN and the user SELECT run
# # on one connection inside one transaction, blocking concurrent DDL
# # between them. The only thing the flag changes is the offender
# # check at the end of the type-resolve step: VIEW / SYSTEM VIEW
# # results no longer trigger a rejection. Information_schema is still
# # queried so the audit record can report which objects were touched.
# #
# # Set `allow_views = true` ONLY after the operator has:
# #   * reviewed every view that this scope can reach,
# #   * confirmed each view's DEFINER does not exceed the readonly user,
# #   * confirmed the view's base tables stay inside this scope's
# #     allowed_schemas (or are themselves intended for query access),
# #   * documented why the view is preferred over querying the base
# #     tables directly.
# #
# # Hard cap, independent of this flag: at most
# # `MAX_VIEW_TARGETS_PER_QUERY = 32` distinct (schema, table) pairs
# # may appear in a single SELECT. A query that joins more than 32
# # tables/views will be refused before any database round-trip.
# #
# # The audit record for every query against this scope will include
# # `views_allowed = true`, so reviewers can grep the audit stream to
# # find scopes that took the opt-in.
# allow_views = false

# AWS Organizations 自動帳號發現（取消註解後會在啟動時展開 ACTIVE accounts）：
# Terraform 也需設定：
# assumable_role_arn_patterns = ["arn:aws:iam::*:role/CanopyRole"]
# [[rules.allowed_accounts]]
# account_id = "*"
# account_name = "organization"
# role_arn = "arn:aws:iam::{account_id}:role/CanopyRole"

# 只顯示特定 tag 的機器（取消註解啟用）：
# [[rules.instance_tag_selectors]]
# [rules.instance_tag_selectors.tags]
# Environment = ["production", "staging"]

# 排除特定機器（取消註解啟用）：
# [[rules.excluded_tag_selectors]]
# [rules.excluded_tag_selectors.tags]
# Sensitivity = ["high"]


# ── 群組 1B：平台工程 power-action（高風險，獨立 role）────────
#
# Start / Stop / Reboot 屬於高風險操作，建議遵循 least-privilege：
#   1. 用獨立 IAM role `CanopyOperatorRole`（與 read-only
#      `CanopyRole` 分離）
#   2. 用 instance_tag_selectors 限縮可操作的機器範圍
#   3. 同 group 的 user 同時 match read rule + power rule，
#      control-plane 會按操作類型自動挑選對應 role
#
# 觸發每次 power action 都會寫一筆 `ec2_power` audit log，含
# previous_state / requested_state / power_action / confirmation_present
# （詳見 docs/en/AUDIT-SCHEMA.md）。
#
# control-plane `/api/ec2/power` 會用這個獨立 rule 的 account / region /
# tag selector scope 做二次授權，通過後才會呼叫 AWS power API。

# [[rules]]
# id = "rule-platform-eng-power"
# group = "platform-engineering"
# allowed_regions = ["ap-northeast-1"]
#
# [rules.features]
# can_start_ec2 = true
# can_stop_ec2 = true
# can_reboot_ec2 = true
#
# [[rules.allowed_accounts]]
# account_id = "<ACCOUNT_ID>"
# account_name = "production"
# role_arn = "arn:aws:iam::<ACCOUNT_ID>:role/CanopyOperatorRole"  # ← 新 role
#
# # 強烈建議：用 tag 限縮可被 power 的機器（例：只允許 staging）
# [[rules.instance_tag_selectors]]
# [rules.instance_tag_selectors.tags]
# Environment = ["staging"]


# ── 群組 1C：平台工程 ECS task / exec（獨立 scope）────────
#
# `can_view_ecs` 只允許在 TUI 的 ECS view 看到授權 cluster/task。
# `can_use_ecs_exec` 允許進入 task container，必須同時有
# `can_view_ecs = true`，而且必須設定 allowed_clusters。
#
# ECS Exec 會固定執行 `/bin/sh`，不接受使用者自訂 command；
# control-plane 會先檢查 task/container scope、sidecar denylist、
# 可用時做 IAM simulation，並透過 STS inline policy 與 audit fail-closed
# 作為最終執行邊界。
#
# [[rules]]
# id = "rule-platform-eng-ecs"
# group = "platform-engineering"
# allowed_regions = ["ap-northeast-1"]
# allowed_clusters = [
#     "arn:aws:ecs:ap-northeast-1:<ACCOUNT_ID>:cluster/prod-app",
# ]
# excluded_container_names = ["envoy", "xray-daemon", "log-router"]
#
# [rules.features]
# can_view_ecs = true
# can_use_ecs_exec = true
#
# [[rules.allowed_accounts]]
# account_id = "<ACCOUNT_ID>"
# account_name = "production"
# role_arn = "arn:aws:iam::<ACCOUNT_ID>:role/CanopyEcsExecRole"
#
# # 強烈建議：用 task tag 限縮可看到 / 可 exec 的 task。
# [[rules.task_tag_selectors]]
# [rules.task_tag_selectors.tags]
# Environment = ["production"]
#
# # 可選：排除敏感 task。
# [[rules.excluded_task_tag_selectors]]
# [rules.excluded_task_tag_selectors.tags]
# Sensitivity = ["high"]


# ── 群組 2：唯讀維運 ────────────────────────────────

# [[rules]]
