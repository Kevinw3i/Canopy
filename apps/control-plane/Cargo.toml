[package]
name = "control-plane"
version.workspace = true
edition.workspace = true

[dependencies]
entitlements = { path = "../../crates/entitlements" }
shared = { path = "../../crates/shared" }

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true

aws-config.workspace = true
aws-sdk-ec2.workspace = true
aws-sdk-ecs.workspace = true
aws-sdk-cloudwatchlogs.workspace = true
aws-sdk-secretsmanager.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-organizations.workspace = true
aws-sdk-ssm.workspace = true
aws-sdk-sts.workspace = true
aws-sdk-iam.workspace = true
aws-sdk-dynamodb.workspace = true
aws-credential-types.workspace = true
aws-types.workspace = true

sha2.workspace = true
hmac.workspace = true
hex.workspace = true
base64.workspace = true
aes-gcm.workspace = true
async-trait.workspace = true
mysql_async.workspace = true
sqlparser.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
totp-rs.workspace = true
passkey-auth.workspace = true
toml = "0.8"
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
hyper = "1"
http-body-util = "0.1"
rsa = "0.9"
rand = "0.8"
tempfile = "3"
# Real WebSocket client for end-to-end live-tail route tests
# (cannot be done via tower::oneshot because axum's WebSocketUpgrade
# extractor needs hyper's OnUpgrade connection extension).
tokio-tungstenite = "0.24"
# Heavyweight MySQL E2E tests are tagged `#[ignore]` so that
# `cargo test --workspace` (which everyone runs) does not require a
# Docker daemon. To run them explicitly:
#
#   cargo test --workspace -- --ignored
#
# CI runners that opt in must have Docker available.
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["mysql"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ciborium = "0.2"
ed25519-dalek = "2"
